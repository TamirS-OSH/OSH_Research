# TEMPORARY diagnostic workflow — safe to delete.
# Purpose: verify whether GitHub Actions actually fires `schedule` events for
# this repo. Runs every 15 minutes and does nothing but echo a timestamp.
# No secrets, no email, no deploy, no external side effects.
name: CRON TEST (temporary)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Echo trigger info
        run: |
          echo "Triggered by event: ${{ github.event_name }}"
          echo "UTC now: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
