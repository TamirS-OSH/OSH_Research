name: IIOSH Weekly Automation

# All three inputs default to true, so the weekly Apps Script trigger — which
# POSTs only {ref: main} and supplies no inputs — keeps behaving exactly as
# before. They exist so a single edition can be run in isolation for testing or
# after a partial failure, without sending the institutional newsletter to the
# whole distribution list as a side effect.
on:
  workflow_dispatch:
    inputs:
      run_dashboard:
        description: 'Update the Looker Studio dashboard'
        type: boolean
        default: true
      run_iiosh:
        description: 'Send the IIOSH institutional newsletter (goes to the full distribution list)'
        type: boolean
        default: true
      run_occ:
        description: 'Send the occupational cancer edition'
        type: boolean
        default: true

jobs:
  update-dashboard:
    if: ${{ inputs.run_dashboard }}
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/142538704961/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'journal-dashboard-bot@research-497406.iam.gserviceaccount.com'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Run Data Pipeline
        run: python dashboard/scraper.py

  send-newsletter:
    if: ${{ inputs.run_iiosh }}
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r newsletter/requirements.txt

      - name: Generate Newsletter & Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_LIST: ${{ secrets.RECIPIENT_LIST }}
          PAGE_BASE_URL: 'https://tamirs-osh.github.io/OSH_Research'
          # Contact email for OpenAlex "polite pool" (reuses existing secret).
          OPENALEX_MAILTO: ${{ secrets.GMAIL_USER }}
          # Stream Python output live so [DIAG] lines are timestamped correctly.
          PYTHONUNBUFFERED: '1'
        run: python newsletter/newsletter.py

      - name: Prepare Pages content
        id: prep
        run: |
          shopt -s nullglob
          files=(IIOSH_Research_Update_*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No newsletter HTML produced (0 articles fetched). Skipping publish. Check the [DIAG] lines in the newsletter step for OpenAlex HTTP statuses."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p pages_output
          cp IIOSH_Research_Update_*.html pages_output/
          latest=$(ls -t IIOSH_Research_Update_*.html | head -1)
          cp "$latest" pages_output/index.html
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.prep.outputs.produced == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_output
          keep_files: true

  # Second edition: occupational cancer research, for a single researcher.
  # `needs:` serialises it behind the IIOSH edition so the two never hit the
  # shared GEMINI_API_KEY concurrently — the 12s sleeps in newsletter.py are
  # calibrated for one caller at ~5 RPM. `if: always()` keeps that ordering
  # without coupling failure: an IIOSH error must not silently cancel this send.
  send-newsletter-occ:
    # always() keeps the ordering without coupling failure — an IIOSH error, or
    # an IIOSH job skipped via run_iiosh, must not cancel this send.
    if: ${{ always() && inputs.run_occ }}
    runs-on: ubuntu-latest
    needs: send-newsletter

    permissions:
      contents: 'write'

    steps:
      # Extra margin on top of the natural runner teardown/spin-up gap, in case
      # quota is accounted over a sliding window. Note this does nothing for a
      # daily (RPD) limit — that would need a different day, not a longer wait.
      # Pointless when nothing ran before us, so skipped on an occ-only run.
      - name: Cool-off before second edition
        if: needs.send-newsletter.result != 'skipped'
        run: sleep 300

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r newsletter/requirements.txt

      - name: Generate Newsletter & Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_LIST_OCC: ${{ secrets.RECIPIENT_LIST_OCC }}
          PAGE_BASE_URL: 'https://tamirs-osh.github.io/OSH_Research/occ'
          OPENALEX_MAILTO: ${{ secrets.GMAIL_USER }}
          PYTHONUNBUFFERED: '1'
        run: python newsletter/newsletter.py --edition occ_cancer

      # The tracked-author feed uses a 30-day window, so without a persisted
      # seen-set the same paper would be re-sent for four consecutive weeks.
      # Non-fatal: the newsletter has already gone out by this point, and the
      # only cost of a failed push is duplicates next run.
      - name: Persist author-feed seen state
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "No seen-state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore: update occ_cancer author-feed seen state [skip ci]"
          # Push back to whichever branch was dispatched, never a hardcoded main —
          # a test run on a feature branch must not write its state onto main.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Prepare Pages content
        id: prep
        run: |
          shopt -s nullglob
          files=(OccCancer_Research_Update_*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No occupational-cancer newsletter HTML produced (0 articles passed the keyword filter, or 0 fetched). Skipping publish. Check the [KW] and [DIAG] lines above."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Published under /occ so the two editions never contend for index.html.
          mkdir -p pages_output/occ
          cp OccCancer_Research_Update_*.html pages_output/occ/
          latest=$(ls -t OccCancer_Research_Update_*.html | head -1)
          cp "$latest" pages_output/occ/index.html
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.prep.outputs.produced == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_output
          keep_files: true
