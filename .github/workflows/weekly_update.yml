name: IIOSH Weekly Automation
run-name: ${{ inputs.dry_run_email != '' && 'IIOSH Weekly Automation (dry run)' || 'IIOSH Weekly Automation' }}

# Filling dry_run_email makes it a dry run: the dashboard still updates (a full
# rewrite, safe to repeat), but the newsletter goes ONLY to that address and is
# published under /preview instead of replacing the public homepage. A single
# field (rather than a checkbox plus an address) means a dry run can't be half
# set up. Empty by default, so the Apps Script trigger (no inputs) runs for real.
on:
  workflow_dispatch:
    inputs:
      dry_run_email:
        description: 'DRY RUN: your email address. Only you get the newsletter. Leave EMPTY for a real run to all recipients.'
        type: string
        required: false
        default: ''

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT under Settings → Secrets and
      # variables → Actions → Variables to point at another Google Cloud project
      # (see HANDOVER.md, Part 3). Unset, they fall back to the original project.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || 'projects/142538704961/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'journal-dashboard-bot@research-497406.iam.gserviceaccount.com' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Run Data Pipeline
        run: python dashboard/scraper.py

  send-newsletter:
    runs-on: ubuntu-latest

    permissions:
      contents: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r newsletter/requirements.txt

      # The repo is public, so the address is read from the event payload (never
      # echoed in a script or env listing) and masked before anything logs it.
      # The Pages address is built from the account and repo names, so renaming
      # the GitHub account needs no code change. Dry-run emails link to the
      # /preview copy, so their buttons work too.
      - name: Read dry-run address
        id: mode
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          addr=$(jq -r '.inputs.dry_run_email // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')
          if [ -z "$addr" ]; then
            echo "page_url=$base" >> "$GITHUB_OUTPUT"
            echo "Real run: newsletter goes to the full recipient list. Links point to $base"
            exit 0
          fi
          echo "::add-mask::$addr"
          if ! [[ "$addr" =~ ^[^@,]+@[^@,]+\.[^@,]+$ ]]; then
            echo "::error::dry_run_email must be a single email address."
            exit 1
          fi
          echo "DRY_RUN_EMAIL=$addr" >> "$GITHUB_ENV"
          echo "dry_run=true" >> "$GITHUB_OUTPUT"
          echo "page_url=$base/preview" >> "$GITHUB_OUTPUT"
          echo "Dry run: newsletter goes only to the address given, published under /preview. Links point to $base/preview"

      - name: Generate Newsletter & Send Email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_LIST: ${{ secrets.RECIPIENT_LIST }}
          PAGE_BASE_URL: ${{ steps.mode.outputs.page_url }}
          # Contact email for OpenAlex "polite pool" (reuses existing secret).
          OPENALEX_MAILTO: ${{ secrets.GMAIL_USER }}
          # Stream Python output live so [DIAG] lines are timestamped correctly.
          PYTHONUNBUFFERED: '1'
        run: python newsletter/newsletter.py

      - name: Prepare Pages content
        id: prep
        run: |
          shopt -s nullglob
          files=(IIOSH_Research_Update_*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No newsletter HTML produced (0 articles fetched). Skipping publish. Check the [DIAG] lines in the newsletter step for OpenAlex HTTP statuses."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p pages_output
          cp IIOSH_Research_Update_*.html pages_output/
          latest=$(ls -t IIOSH_Research_Update_*.html | head -1)
          cp "$latest" pages_output/index.html
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.prep.outputs.produced == 'true' && steps.mode.outputs.dry_run != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_output
          keep_files: true

      - name: Deploy dry-run preview to GitHub Pages (/preview)
        if: steps.prep.outputs.produced == 'true' && steps.mode.outputs.dry_run == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_output
          destination_dir: preview
          keep_files: true
